    <style>

        .controls { display: flex; justify-content: center; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }

        .controls select { background: #2a2a4a; color: white; min-width: 150px; }
        .controls button { background: linear-gradient(135deg, #e94560, #c73659); color: white; font-weight: bold; }
        .controls button:hover { transform: translateY(-2px); }
        .flashcard-container { display: flex; justify-content: center; perspective: 1000px; }
        .flashcard { width: 650px; height: 780px; position: relative; transform-style: preserve-3d; transition: transform 0.6s; cursor: pointer; }
        .flashcard.flipped { transform: rotateY(180deg); }
        .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 15px; background: white; box-shadow: 0 10px 40px rgba(0,0,0,0.3); overflow: hidden; }
        .card-front { display: flex; flex-direction: column; }
        .card-back { transform: rotateY(180deg); display: flex; flex-direction: column; }
        .country-flag { height: 160px; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #f8f9fa, #e9ecef); }
        .country-flag svg { width: 190px; height: 120px; border-radius: 6px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .country-info { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; text-align: center; }
        .country-name { font-size: 1.9em; font-weight: bold; color: #2c3e50; }
        .country-name-cn { font-size: 1em; color: #666; margin: 5px 0 15px; }
        .capital-name { font-size: 1.4em; color: #e94560; }
        .capital-name-cn { font-size: 0.95em; color: #888; margin-bottom: 15px; }
        .btn-group { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
        .pronunciation-btn { padding: 10px 20px; background: linear-gradient(135deg, #3498db, #2980b9); color: white; border: none; border-radius: 25px; font-size: 0.95em; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: all 0.3s; }
        .pronunciation-btn:hover { transform: scale(1.05); }
        .pronunciation-btn.capital-btn { background: linear-gradient(135deg, #9b59b6, #8e44ad); }
        .card-header { padding: 15px; background: linear-gradient(135deg, #2c3e50, #34495e); color: white; text-align: center; }
        .card-header h2 { font-size: 1.5em; }
        .card-header p { opacity: 0.9; margin-top: 3px; font-size: 0.95em; }
        .map-section { flex: 1; display: flex; flex-direction: column; }
        .map-area { padding: 15px; background: linear-gradient(135deg, #e8f4f8, #d4e8f0); display: flex; flex-direction: column; align-items: center; gap: 15px; min-height: 220px; }
        .shape-display { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 12px; }
        .shape-svg { width: 270px; height: 270px; }
        .shape-svg .country-outline { fill: #5b9bd5; stroke: #1f3d5c; stroke-width: 1.2; }
        .shape-svg .sea-bg { fill: #b8d4e8; }
        .shape-svg .capital-marker { fill: #e74c3c; stroke: white; stroke-width: 1.2; filter: drop-shadow(0 1px 2px rgba(0,0,0,0.4)); }
        .shape-svg .capital-label { font-size: 7px; font-weight: bold; fill: #b02218; paint-order: stroke; stroke: #ffffff; stroke-width: 2.5px; stroke-linejoin: round; }

        .shape-label { font-size: 1.1em; color: #2c3e50; font-weight: bold; text-align: center; padding: 15px 25px; background: #fff3cd; border-radius: 10px; border: 2px solid #ffc107; }
        .memory-section { background: linear-gradient(135deg, #fff9e6, #fff5d6); border-top: 3px solid #f39c12; padding: 12px 15px; }
        .memory-title { font-size: 0.95em; font-weight: bold; color: #b8860b; margin-bottom: 6px; }
        .memory-content { display: flex; align-items: center; gap: 10px; }
        .memory-icon { font-size: 1.8em; flex-shrink: 0; }
        .memory-text { font-size: 0.88em; color: #5d4e37; line-height: 1.5; }
        .memory-text strong { color: #8b4513; }
        .card-footer { padding: 10px; background: #ecf0f1; text-align: center; color: #7f8c8d; font-size: 0.8em; }
        .hint { text-align: center; color: #a0a0a0; margin-top: 12px; font-size: 0.9em; }
        .country-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(65px, 1fr)); gap: 6px; max-width: 680px; margin: 12px auto; padding: 12px; }
        .country-thumb { padding: 6px; background: #2a2a4a; border-radius: 6px; text-align: center; cursor: pointer; color: white; transition: all 0.3s; }

        .nav-dot:hover { background: #e94560; }
        .progress-bar { text-align: center; color: #a0a0a0; margin-top: 8px; font-size: 0.85em; }

        .flashcard {
    width: 100%;
    max-width: 650px;
}

.shape-display {
    width: 100%;
    min-width: 0;
}

.shape-label {
    max-width: 100%;

        <p class="subtitle">德语小学词汇 - 47个欧洲国家</p>
    </div>

    <div class="controls">
        <select id="regionFilter" onchange="filterCountries(this.value)">
            <option value="all">Alle Länder</option>
            <option value="westeuropa">Westeuropa</option>
            <option value="osteuropa">Osteuropa</option>
            <option value="suedeuropa">Südeuropa</option>
            <option value="nordeuropa">Nordeuropa</option>

        <button onclick="shuffleCards()">Mischen</button>
        <button onclick="prevCard()">◀</button>
        <button onclick="nextCard()">▶</button>
    </div>

    <div class="country-grid" id="countryGrid"></div>

    <div class="flashcard-container">
        <div class="flashcard" id="flashcard" onclick="flipCard()">
            <div class="card-face card-front">

                        <button class="pronunciation-btn" onclick="event.stopPropagation(); speakText('country')">🔊 Land</button>
                        <button class="pronunciation-btn capital-btn" onclick="event.stopPropagation(); speakText('capital')">🔊 Hauptstadt</button>
                    </div>
                </div>
            </div>
            <div class="card-face card-back">
                <div class="card-header">
                    <h2 id="backCountryName"></h2>
                    <p>Hauptstadt: <span id="backCapitalName"></span></p>
                </div>
                <div class="map-section">
                    <div class="map-area">
                        <div class="shape-display">
                            <svg class="shape-svg" id="shapeSvg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"></svg>
                            <div class="shape-label" id="shapeLabel"></div>
                        </div>
                    </div>
                    <div class="memory-section">
                        <div class="memory-title">🧠 Merkhilfe · 联想记忆</div>
                        <div class="memory-content">
                            <span class="memory-icon" id="memoryIcon"></span>
                            <div class="memory-text" id="memoryText"></div>
                        </div>
                    </div>
                </div>
                <div class="card-footer">点击翻转 | Leertaste</div>
            </div>
        </div>
    </div>

    <p class="hint">← → 键盘切换 | 空格键翻转</p>
    <div class="nav-dots" id="navDots"></div>
    <div class="progress-bar" id="progressBar"></div>

function updateCard() {
    var c = filteredCountries[currentIndex];
    if (!c) return;

    document.getElementById('cardFlag').innerHTML = c.flagSvg;
    document.getElementById('countryName').textContent = c.name;
    document.getElementById('countryNameCn').textContent = c.nameCn;
    document.getElementById('capitalName').textContent = c.capital;
    document.getElementById('capitalNameCn').textContent = c.capitalCn;

    document.getElementById('backCountryName').textContent = c.name;
    document.getElementById('backCapitalName').textContent =
        c.capital + ' (' + c.capitalCn + ')';

    // 第一次更新时，将原来的空 SVG 换成地图容器。
    var mapBox = document.getElementById('europeMap');

    if (!mapBox) {
        var oldSvg = document.getElementById('shapeSvg');

        mapBox = document.createElement('div');
        mapBox.id = 'europeMap';
        mapBox.style.width = '100%';
        mapBox.style.maxWidth = '560px';
        mapBox.style.height = '320px';

        oldSvg.replaceWith(mapBox);
    }

    mapBox.innerHTML = '';

    var location = capitalLocations[c.name];

    if (location) {
        var lat = location[0];
        var lon = location[1];

        // 欧洲范围：西、南、东、北。
        var bbox = '-25,33,55,72';

        var frame = document.createElement('iframe');
        frame.title = c.name + '：首都在欧洲的位置';
        frame.width = '100%';
        frame.height = '100%';
        frame.style.border = '0';
        frame.style.borderRadius = '8px';

        frame.src =
            'https://www.openstreetmap.org/export/embed.html' +
            '?bbox=' + encodeURIComponent(bbox) +
            '&layer=mapnik' +
            '&marker=' + encodeURIComponent(lat + ',' + lon);

        mapBox.appendChild(frame);
    } else {
        mapBox.textContent = '暂未添加该国家的首都坐标：' + c.name;
    }

    document.getElementById('shapeLabel').textContent =
        c.nameCn + ' · 地图标记为首都位置';

    // 原 HTML 中可能没有 shapeIcon，先判断再使用。
    var shapeIcon = document.getElementById('shapeIcon');
    if (shapeIcon) {
        shapeIcon.textContent = c.shapeIcon || '';
    }

    // 没有记忆数据时使用默认内容，避免脚本报错。
    var memory = c.memory || {};

    document.getElementById('memoryIcon').textContent =
        memory.icon || '📍';

    var memoryText = document.getElementById('memoryText');

    if (memory.text) {
        memoryText.innerHTML = memory.text;
    } else {
        memoryText.textContent =
            c.name + '（' + c.nameCn + '）的首都是 ' +
            c.capital + '（' + c.capitalCn + '）。';
    }

    updateNavDots();

    document.getElementById('progressBar').textContent =
        (currentIndex + 1) + ' / ' + filteredCountries.length;
}


function flipCard() { document.getElementById('flashcard').classList.toggle('flipped'); }
function nextCard() { document.getElementById('flashcard').classList.remove('flipped'); currentIndex = (currentIndex + 1) % filteredCountries.length; updateCard(); }
function prevCard() { document.getElementById('flashcard').classList.remove('flipped'); currentIndex = (currentIndex - 1 + filteredCountries.length) % filteredCountries.length; updateCard(); }

function shuffleCards() {
    for (var i = filteredCountries.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var temp = filteredCountries[i];
        filteredCountries[i] = filteredCountries[j];
        filteredCountries[j] = temp;
    }
    currentIndex = 0;
    document.getElementById('flashcard').classList.remove('flipped');
    updateCard();
    updateCountryGrid();
}

function filterCountries(region) {
    if (region === 'all') filteredCountries = countries.slice();
    else filteredCountries = countries.filter(function(c) { return c.region === region; });
    currentIndex = 0;
    document.getElementById('flashcard').classList.remove('flipped');
    updateCard();
    updateCountryGrid();
}

function speakText(type) {
    var c = filteredCountries[currentIndex];
    var text = type === 'country' ? c.name : c.capital;
    if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        var utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'de-DE';
        utterance.rate = 0.75;
        window.speechSynthesis.speak(utterance);
    } else {
        alert('Ihr Browser unterstützt keine Sprachsynthese.');
    }
}

function updateCountryGrid() {
    var grid = document.getElementById('countryGrid');
    grid.innerHTML = '';
    for (var i = 0; i < filteredCountries.length; i++) {
        var c = filteredCountries[i];
        var thumb = document.createElement('div');
        thumb.className = 'country-thumb';
        thumb.innerHTML = '<span class="code">' + c.name.substring(0,3) + '</span>';
        thumb.onclick = (function(index) { return function() { goToCard(index); }; })(i);
        grid.appendChild(thumb);
    }
}

document.addEventListener('keydown', function(e) {
    if (e.key === 'ArrowRight') nextCard();
    else if (e.key === 'ArrowLeft') prevCard();
    else if (e.key === ' ') { e.preventDefault(); flipCard(); }
});

updateCard();
updateCountryGrid();
